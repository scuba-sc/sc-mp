name: host-context

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/host-context.yml'
      - 'spikes/host-context/**'
      - 'cmake/VerifyExtractedKit.cmake'
      - 'cmake/verify_host_context_kit.py'
      - 'tests/host-context/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out sc-mp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out held core candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: scuba-sc/sco-core
          ref: 44ffd1290e261e12684b38ac862ec0c4f08921df
          path: _host_context_core_candidate
          persist-credentials: false
      - name: Package and qualify exact core source
        shell: bash
        run: |
          set -euo pipefail
          core="$GITHUB_WORKSPACE/_host_context_core_candidate"
          evidence="$RUNNER_TEMP/host-context"
          test "$(git -C "$core" rev-parse HEAD)" = 44ffd1290e261e12684b38ac862ec0c4f08921df
          mkdir -p "$evidence/archives"
          CLANG="$(command -v clang-18)" python3 "$core/sdk/package.py" --profile core-source --out "$evidence/archives"
          archive="$evidence/archives/sco-sdk-core-source-2.4.0.zip"
          printf '%s  %s\n' 807a322eab2b3d8c25e10c3582008ec3ec50b6b536bc947f2b28cf4b63095c22 "$archive" | sha256sum --check
          for mode in release asan; do
            options=()
            if [ "$mode" = asan ]; then options+=(--sanitize); fi
            if ! python3 spikes/host-context/qualify.py --core-archive "$archive" \
                 --output "$evidence/$mode" --cmake "$(command -v cmake)" \
                 --cc "$(command -v clang-18)" --cxx "$(command -v clang++-18)" "${options[@]}"; then
              for log in "$evidence/$mode"/*.log "$evidence/$mode"/receipt.json; do
                if [ -f "$log" ]; then printf '\n--- %s ---\n' "$log"; cat "$log"; fi
              done
              exit 1
            fi
            cat "$evidence/$mode/verifier-tests.log" "$evidence/$mode/ctest.log" "$evidence/$mode/receipt.json"
          done

      - name: Upload exact core-source archive for Windows fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: host-context-core-source-44ffd
          path: ${{ runner.temp }}/host-context/archives/sco-sdk-core-source-2.4.0.zip
          if-no-files-found: error
          retention-days: 1

  synthetic-windows:
    needs: synthetic-linux
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out sc-mp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download exact core-source archive from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: host-context-core-source-44ffd
          path: host-context-artifact

      - name: Check exact 44ffd archive and extracted inventory
        shell: bash
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/host-context-artifact/sco-sdk-core-source-2.4.0.zip"
          extract="$RUNNER_TEMP/host-context-kit"
          python - "$archive" <<'PY'
          import hashlib
          import pathlib
          import sys
          actual = hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest()
          expected = "807a322eab2b3d8c25e10c3582008ec3ec50b6b536bc947f2b28cf4b63095c22"
          if actual != expected:
              raise SystemExit(f"core-source archive hash mismatch: {actual}")
          print("core-source archive hash verified")
          PY
          mkdir -p "$extract"
          python -m zipfile -e "$archive" "$extract"
          python cmake/verify_host_context_kit.py \
            "$extract/sco-sdk-core-source-2.4.0" \
            812d09236dc952309d3f1c63a843f6ff0407f6465066c4bd7d068b123d3b503c

      - name: Configure Windows Release fixture (MSVC x64)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S spikes/host-context -B "$RUNNER_TEMP/host-context-windows" -A x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDK_ROOT="$RUNNER_TEMP/host-context-kit/sco-sdk-core-source-2.4.0"

      - name: Build Windows Release fixture
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/host-context-windows" --config Release \
            --target host-context --parallel 2

      - name: Run all adapter lifecycle cases
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "$RUNNER_TEMP/host-context-windows" -C Release \
            --output-on-failure --no-tests=error
